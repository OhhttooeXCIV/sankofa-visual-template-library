name: Sankofa Supabase contracts
on: { workflow_call: {} }
jobs:
  supabase:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - name: Validate migration files
        shell: bash
        run: |
          test -d packages/supabase/migrations
          grep -R "enable row level security" packages/supabase/migrations
