name: Sankofa CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality: { uses: ./.github/workflows/reusable-quality.yml }
  security: { uses: ./.github/workflows/reusable-security.yml }
  supabase: { uses: ./.github/workflows/reusable-supabase.yml }
